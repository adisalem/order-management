name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    name: Deploy to OKE
    runs-on: ubuntu-latest

    # Deploy only when CI completed successfully.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Create kubeconfig
        shell: bash
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
        run: |
          mkdir -p "${HOME}/.kube"

          cat > "${HOME}/.kube/config" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: oke
              cluster:
                server: ${KUBE_SERVER}
                certificate-authority-data: ${KUBE_CA}
          contexts:
            - name: oke
              context:
                cluster: oke
                user: deployer
                namespace: default
          current-context: oke
          users:
            - name: deployer
              user:
                token: ${KUBE_TOKEN}
          EOF

          chmod 600 "${HOME}/.kube/config"

      - name: Verify Kubernetes access
        run: |
          kubectl auth can-i get deployments -n default
          kubectl auth can-i update deployments -n default
          kubectl auth can-i get services -n default
          kubectl auth can-i update services -n default

      - name: Apply RBAC
        run: |
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/role.yaml
          kubectl apply -f k8s/role-binding.yaml

      - name: Apply Kubernetes Service
        run: |
          kubectl apply -f k8s/service.yaml

      - name: Apply Kubernetes Deployment
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Update image
        env:
          IMAGE: docker.io/adishadush/order-management:${{ github.event.workflow_run.head_sha }}
        run: |
          kubectl set image deployment/order-management \
            order-management="${IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/order-management \
            --timeout=180s